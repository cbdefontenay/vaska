[application]
name = "Vaska"
default_platform = "mobile"
asset_dir = "assets"

[bundle]
identifier = "com.cyprien.vaska"
publisher = "cyprien"
icon = ["assets/logo.png", "assets/app-icon.png"]
resources = ["assets/**/*.css"]
copyright = "Copyright © 2026 cyprien. All rights reserved."
category = "Utility"
short_description = "Nettoyeur d'URL et suppression de trackers"
long_description = "Vaska est une application Android qui permet de suivre les liens de partage sur les réseaux sociaux et d'enlever les trackers qui se trouvent dans les liens. Simplifiez vos URLs et protégez votre vie privée."

[android]
target_sdk = 36
min_sdk = 24
compile_sdk = 36
icon = ["assets/logo.png"]

[bundle.android]
jks_file = "release.jks"
jks_password = "vaska123"
key_alias = "vaska"
key_password = "vaska123"

[profile.release]
opt-level = "z"       # Optimise pour la taille
debug = false
lto = true            # Link-time optimization
codegen-units = 1     # Une seule unité de compilation pour mieux optimiser
panic = "abort"       # Plus petit que le unwinding
strip = true          # Supprime les symboles de débogage
incremental = false

[web.app]

# HTML title tag content
title = "Vaska"

# include `assets` in web platform
[web.resource]

# Additional CSS style files
style = []

# Additional JavaScript files
script = []

[web.resource.dev]

# Javascript code file
# serve: [dev-server] only
script = []
